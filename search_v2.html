<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萊廷照明 — 篩選器原型 v2</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    :root {
      --font-base: 17px;
      --font-sm: 14px;
      --font-lg: 20px;
      --font-xl: 22px;
      --touch: 48px;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #d8dee7;
      --text: #1a1a1a;
      --text-muted: #555;
      --primary: #1a5fa8;
      --primary-dark: #134b88;
      --price: #0a7c30;
      --tag-bg: #e8f0fb;
      --tag-text: #1a5fa8;
      --tag-active-bg: #1a5fa8;
      --tag-active-text: #fff;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
      --header-h: 56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-padding-top: var(--header-h); }
    body {
      font-family: "微軟正黑體", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: var(--font-base);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-top: var(--header-h);
    }
    button, input, select { font: inherit; }

    /* ── Header ── */
    #site-header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: var(--primary); color: #fff; z-index: 100;
      display: flex; align-items: center; padding: 0 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .header-inner {
      display: flex; align-items: center; gap: 12px;
      width: 100%; max-width: 1200px; margin: 0 auto; min-width: 0;
    }
    .header-logo {
      width: 38px; height: 38px; border-radius: 6px;
      background: #fff; object-fit: contain; flex: 0 0 auto;
    }
    .header-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    #site-header h1 { font-size: 20px; font-weight: 700; }
    .header-sub { font-size: 13px; opacity: 0.85; white-space: nowrap; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .proto-tag {
      background: rgba(255,255,255,0.18); color: #fff;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    /* v0.4 M8：header 圖示按鈕（搜索縮放 / 功能選單） */
    .header-icon-btn {
      width: 40px; height: 40px; flex: 0 0 auto;
      background: rgba(255,255,255,0.16); color: #fff;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .header-icon-btn:hover, .header-icon-btn[aria-expanded="true"] { background: rgba(255,255,255,0.32); }
    @media (max-width: 480px) { .header-sub { display: none; } .proto-tag { display: none; } }

    /* v0.4 M8 / v0.5：header 搜索面板（一般 + 進階，可捲動） */
    .header-search {
      position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 99;
      background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow); padding: 10px 16px;
      max-height: calc(100vh - var(--header-h)); overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .header-search[hidden] { display: none; }
    .header-search-box { max-width: 1200px; margin: 0 auto; }
    .header-search-inner { display: flex; gap: 8px; align-items: center; }
    .header-search-inner input {
      flex: 1 1 auto; min-width: 0; height: var(--touch);
      padding: 0 14px; border: 2px solid var(--primary); border-radius: var(--radius);
      font-size: var(--font-base); background: #fff;
    }
    .header-search-inner button {
      width: var(--touch); height: var(--touch); flex: 0 0 auto;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: var(--radius); font-size: 16px; cursor: pointer;
    }

    /* v0.4 M8：總功能選單（下拉面板） */
    .main-menu {
      position: fixed; top: var(--header-h); right: 0; z-index: 99;
      width: 280px; max-width: 88vw;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow-hover); padding: 8px;
    }
    .main-menu[hidden] { display: none; }
    .menu-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: var(--touch); padding: 10px 12px;
      border: none; background: none; border-radius: var(--radius);
      font-size: var(--font-base); color: var(--text); text-align: left; cursor: pointer;
    }
    .menu-item:hover { background: var(--bg); }
    .menu-item .soon {
      margin-left: auto; font-size: 11px; font-weight: 700;
      color: var(--text-muted); background: var(--bg);
      padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .menu-footer {
      padding: 10px 12px 4px; margin-top: 4px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted);
    }

    /* ── Controls bar ── */
    .controls-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px 12px; }
    .controls-inner { max-width: 1200px; margin: 0 auto; }
    .search-row { margin-bottom: 10px; }
    .search-wrap { position: relative; max-width: 720px; }
    #search-input {
      width: 100%; height: var(--touch); padding: 0 44px 0 16px;
      font-size: var(--font-base); border: 2px solid var(--border);
      border-radius: 8px; background: #fff; color: var(--text);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 95, 168, 0.12);
    }
    #clear-search {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px;
      color: var(--text-muted); width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    #clear-search:hover { background: var(--bg); }

    .advanced-toggle {
      width: 100%; min-height: var(--touch);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 0 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: #fff; color: var(--text);
      cursor: pointer; max-width: 720px;
    }
    .advanced-toggle:hover { background: var(--bg); }
    .advanced-toggle:focus {
      border-color: var(--primary); outline: none;
      box-shadow: 0 0 0 3px rgba(26, 95, 168, 0.12);
    }
    .toggle-title { font-weight: 700; font-size: var(--font-sm); }
    .toggle-icon { font-size: 18px; line-height: 1; transition: transform 0.2s; }
    .advanced-toggle[aria-expanded="true"] .toggle-icon { transform: rotate(180deg); }

    .advanced-panel {
      margin-top: 10px; padding: 14px;
      border: 1px solid var(--border); border-radius: 8px;
      background: #fbfcfe;
    }
    .advanced-panel[hidden] { display: none; }

    .filter-section { display: flex; flex-direction: column; gap: 10px; }
    /* v0.5：讓 [hidden] 對 flex 元素生效（覆蓋 .filter-section / .filter-field 的 display） */
    .filter-section[hidden], .filter-field[hidden] { display: none; }
    .filter-section + .filter-section {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px dashed var(--border);
    }
    .filter-section-title {
      font-size: 12px; font-weight: 800; color: var(--text);
      letter-spacing: 0.5px;
    }
    .section-pink .filter-section-title::before {
      content: "●"; color: #d65a82; margin-right: 6px;
    }
    .section-blue .filter-section-title::before {
      content: "●"; color: #4d7fc7; margin-right: 6px;
    }
    .section-series .filter-section-title::before {
      content: "①"; color: var(--primary); margin-right: 6px; font-weight: 700;
    }

    .filter-row {
      display: grid; grid-template-columns: 1fr;
      gap: 10px; align-items: start;
    }
    @media (min-width: 700px) {
      .filter-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .filter-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .filter-field.span-full { grid-column: 1 / -1; }
    .filter-field label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .filter-select, .filter-input {
      height: var(--touch); padding: 0 12px;
      font-size: var(--font-sm); border: 1.5px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--text);
      width: 100%; max-width: 100%;
    }
    .filter-select { cursor: pointer; }
    .filter-select:focus, .filter-input:focus {
      border-color: var(--primary); outline: none;
      box-shadow: 0 0 0 3px rgba(26, 95, 168, 0.12);
    }
    .range-pair {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 6px; align-items: center;
    }
    .range-separator { font-size: var(--font-sm); color: var(--text-muted); text-align: center; }

    /* ── Multi-select dropdown ── */
    .multi-dropdown { position: relative; }
    .md-toggle {
      width: 100%; height: var(--touch);
      padding: 0 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      font-size: var(--font-sm); font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text);
      cursor: pointer; text-align: left;
    }
    .md-toggle:hover { border-color: var(--text-muted); }
    .md-toggle:focus, .md-toggle.open {
      border-color: var(--primary); outline: none;
      box-shadow: 0 0 0 3px rgba(26,95,168,.12);
    }
    .md-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
    .md-summary.has-selection { color: var(--primary); font-weight: 700; }
    .md-arrow { font-size: 12px; color: var(--text-muted); transition: transform .15s; flex-shrink: 0; }
    .md-toggle.open .md-arrow { transform: rotate(180deg); }
    .md-panel {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1.5px solid var(--primary);
      border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
      z-index: 50;
      max-height: 320px; overflow-y: auto;
      padding: 4px 0;
    }
    .md-panel[hidden] { display: none; }
    .md-hint {
      font-size: 11px; color: var(--text-muted);
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: #f9fbff;
    }
    .md-option {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; cursor: pointer;
      font-size: var(--font-sm); min-height: 40px;
      user-select: none;
    }
    .md-option:hover { background: var(--bg); }
    .md-option input[type=checkbox] {
      width: 18px; height: 18px; cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0; margin: 0;
    }
    .chip-empty { font-size: var(--font-sm); color: var(--text-muted); font-style: italic; padding: 8px 0; }

    .filter-actions {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-top: 12px; flex-wrap: wrap;
    }
    .result-count { font-size: var(--font-sm); color: var(--text-muted); }
    #clear-filters {
      height: var(--touch); padding: 0 16px;
      font-size: var(--font-sm); border: 1.5px solid var(--border);
      border-radius: 8px; background: #fff; color: var(--text-muted);
      cursor: pointer; white-space: nowrap;
    }
    #clear-filters:hover { background: var(--bg); color: var(--text); }

    /* ── Grid ── */
    main { padding: 16px; }
    .product-grid {
      display: grid; grid-template-columns: 1fr; gap: 16px;
    }
    @media (min-width: 600px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 1200px; margin: 0 auto;
      }
      main { padding: 24px; }
    }

    /* v0.4 M7：分頁列固定畫面底部，不隨清單捲動 */
    .pagination {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 10px 12px; background: rgba(255,255,255,0.97);
      border-top: 1px solid var(--border); box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    }
    .pagination[hidden] { display: none; }
    .page-btn {
      min-width: var(--touch); height: var(--touch); padding: 0 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: var(--radius); font-size: var(--font-sm); font-weight: 700; cursor: pointer;
    }
    .page-btn:hover:not(:disabled):not(.active) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-ellipsis { padding: 0 2px; color: var(--text-muted); }
    body.has-pagination main { padding-bottom: 80px; }

    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      border: 1.5px solid transparent; min-width: 0;
    }
    .card:hover, .card:focus {
      box-shadow: var(--shadow-hover); transform: translateY(-2px);
      border-color: var(--primary); outline: none;
    }
    .card:active { transform: translateY(0); }
    /* v0.4 M4：圖片固定 4:3 橫向、contain 置中、超出處淺灰 */
    .card-img {
      width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #eef2f7;
      display: flex; align-items: center; justify-content: center;
    }
    .card-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .img-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; padding: 12px; text-align: center;
      background: #eef2f7; color: #475569;
    }
    .placeholder-sku { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
    .placeholder-sub { font-size: 12px; opacity: 0.75; overflow-wrap: anywhere; }

    .card-body {
      padding: 14px 16px 16px;
      display: flex; flex-direction: column; gap: 6px; min-width: 0;
    }
    .card-name { font-size: 18px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    /* v0.4 M4：型號與副標並排；副標加底色 */
    .card-subrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .card-sub {
      font-size: var(--font-sm); color: var(--tag-text); background: var(--tag-bg);
      padding: 2px 8px; border-radius: 6px; font-weight: 600; overflow-wrap: anywhere;
    }
    .card-model { font-size: var(--font-sm); color: var(--text-muted); font-weight: 700; }
    .card-desc { font-size: var(--font-sm); color: var(--text); overflow-wrap: anywhere; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
    /* v0.4 M4：庫存、價格移到底部右側 */
    .card-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: auto; padding-top: 4px; }
    .card-price { font-size: var(--font-lg); font-weight: 700; color: var(--price); margin-left: auto; }
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 12px; background: var(--tag-bg); color: var(--tag-text);
      max-width: 100%; overflow-wrap: anywhere;
    }
    .stock-badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 700;
      margin-top: 4px; align-self: flex-start;
    }
    .stock-ok { background: #dcfce7; color: #166534; }
    .stock-low { background: #fef3c7; color: #92400e; }
    .stock-out { background: #fee2e2; color: #991b1b; }

    .no-result {
      text-align: center; padding: 60px 16px;
      color: var(--text-muted);
    }
    .no-result p { font-size: 18px; margin-bottom: 16px; }
    .no-result button {
      min-height: var(--touch); padding: 12px 24px;
      font-size: var(--font-base); background: var(--primary);
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
    }
    .no-result button:hover { background: var(--primary-dark); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
      padding: 0;
    }
    .modal-overlay[hidden] { display: none; }
    @media (min-width: 600px) {
      .modal-overlay { align-items: center; padding: 24px; }
    }
    .modal {
      background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-height: 90vh; overflow-y: auto;
      position: relative; padding: 0;
    }
    @media (min-width: 600px) {
      .modal { border-radius: var(--radius); max-width: 680px; max-height: 85vh; }
    }
    .modal-close {
      position: sticky; top: 0; float: right;
      margin: 12px 12px 0 0; width: 40px; height: 40px;
      border-radius: 50%; border: none; background: var(--bg);
      font-size: 18px; cursor: pointer; z-index: 1;
      display: flex; align-items: center; justify-content: center; color: var(--text);
    }
    .modal-close:hover { background: var(--border); }
    .modal-header { padding: 16px 60px 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-name { font-size: 20px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    /* v0.4 M5：副標 chip + 簡述並排，庫存接於後 */
    .modal-subline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .modal-sub {
      font-size: var(--font-sm); color: var(--tag-text); background: var(--tag-bg);
      padding: 2px 8px; border-radius: 6px; font-weight: 600;
    }
    .modal-desc { font-size: var(--font-sm); color: var(--text); overflow-wrap: anywhere; }
    .modal-header .stock-badge { margin-top: 8px; }
    .modal-gallery {
      background: #000;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .modal-main-img { width: 100%; height: 220px; object-fit: contain; display: block; }
    @media (min-width: 600px) { .modal-main-img { height: 300px; } }

    /* ── Gallery-overlay nav arrows (mobile only — 提示可滑動) ── */
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px; height: 36px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: background 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .gallery-nav:hover { background: rgba(0, 0, 0, 0.65); }
    .gallery-nav:active { background: rgba(0, 0, 0, 0.8); }
    .gallery-nav:disabled { opacity: 0.2; cursor: not-allowed; }
    .gallery-nav-prev { left: 8px; padding-right: 3px; }
    .gallery-nav-next { right: 8px; padding-left: 3px; }
    @media (max-width: 599px) {
      .gallery-nav { display: flex; }
    }
    .modal-specs { padding: 16px 20px; }
    .specs-table { width: 100%; border-collapse: collapse; font-size: var(--font-base); }
    /* v0.4 M5：隔行深淺底色增加可讀性 */
    .specs-table tr:nth-child(odd)  { background: #f5f7fa; }
    .specs-table tr:nth-child(even) { background: #ffffff; }
    .specs-table th {
      text-align: left; padding: 9px 12px;
      color: var(--text-muted); font-weight: 500;
      white-space: nowrap; vertical-align: top; width: 110px;
    }
    .specs-table td {
      padding: 9px 12px; color: var(--text);
      overflow-wrap: anywhere; white-space: pre-wrap; vertical-align: top;
    }
    /* v0.4 M5：標籤沿用單色 tag 樣式 */
    .spec-tags { display: flex; flex-wrap: wrap; gap: 4px; white-space: normal; }
    .modal-notes { padding: 8px 20px 20px; font-size: var(--font-sm); color: var(--text-muted); }

    /* ── Modal nav arrows (desktop) ── */
    .modal-nav {
      display: none; width: 44px; height: 44px; flex-shrink: 0;
      background: rgba(255,255,255,0.88); color: var(--text);
      border: none; border-radius: 50%; font-size: 22px;
      cursor: pointer; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
    }
    .modal-nav:hover { background: #fff; }
    .modal-nav:disabled { opacity: 0.2; cursor: not-allowed; }
    @media (min-width: 600px) { .modal-nav { display: flex; } }

    /* ── Price reveal (multi-tier) ── */
    .price-reveal-area { padding: 16px 20px; border-top: 2px solid var(--border); }
    .price-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 600px) {
      .price-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .price-tier {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fafbfc;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .price-reveal-btn {
      background: transparent; border: none;
      color: var(--text-muted); font-size: 13px; font-family: inherit;
      padding: 4px 6px; cursor: pointer;
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px;
      min-height: 44px;
    }
    .price-reveal-btn:hover { color: var(--primary); }
    .price-revealed-wrap[hidden] { display: none; }
    .price-revealed {
      font-size: 18px; font-weight: 700;
      animation: priceFadeIn 0.25s ease;
      display: block;
    }
    .price-tier-label {
      display: block; font-size: 11px;
      color: var(--text-muted); font-weight: 400;
      margin-top: 2px;
    }
    .price-hint {
      font-size: 11px;
      color: #92400e;
      background: #fef3c7;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 10px;
      text-align: center;
    }
    @keyframes priceFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.93);
      z-index: 300; display: flex; align-items: center; justify-content: center;
      padding: 20px 60px;
    }
    #lightbox[hidden] { display: none; }
    #lightbox-img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: 4px; }
    .lightbox-close {
      position: absolute; top: 14px; right: 14px;
      width: 40px; height: 40px; background: rgba(255,255,255,0.15);
      color: #fff; border: none; border-radius: 50%;
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.3); }
  </style>

  <script>
  /* ────────────────────────────────────────────────────────────
     篩選器原型 v2
     依「篩選器原型_實作計劃.md」實作
     ──────────────────────────────────────────────────────────── */

  const ALL = JSON.parse(document.getElementById('products-data').textContent);

  /* ── 狀態 ── */
  const state = {
    q: '',
    series: '',
    main: '',
    sub: '',
    tags: new Set(),
    priceMin: '',
    priceMax: '',
    attrs: {},  // { key: Set(...) | { min, max } }
    page: 1     // v0.4 M7：目前頁碼
  };

  const PAGE_SIZE = 24;   // v0.4 M7：每頁筆數

  let filtered = [];
  let currentModalSku = null;
  let savedScrollY = 0;

  /* ── 多層假價（示意用，不是真實內部定價） ── */
  const PRICE_TIERS = [
    { label: '牌價',     mult: 1.0,  color: '#1a5fa8' },
    { label: '零售價',   mult: 0.85, color: '#0a7c30' },
    { label: '批發價',   mult: 0.70, color: '#c05c00' },
    { label: '工程價',   mult: 0.55, color: '#7c2d12' },
    { label: '本月優惠價', mult: 0.45, color: '#991b1b' },
  ];

  /* ── 工具 ── */
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
  const RANGE_RE = /^(\d+(?:\.\d+)?)~(\d+(?:\.\d+)?)$/;

  function parseRange(s) {
    const m = String(s).match(RANGE_RE);
    return m ? [Number(m[1]), Number(m[2])] : null;
  }

  function isNumeric(v) {
    return typeof v === 'number' && Number.isFinite(v);
  }

  function uniq(arr) { return [...new Set(arr)]; }

  /* ── 下拉排序：數字 → 中文筆畫(少~多) → 英文 A-Z（v0.4 M2） ──
     用瀏覽器內建 Intl.Collator(stroke)，純前端、零 token。 */
  const strokeCmp = (() => {
    try { return new Intl.Collator('zh-Hant', { collation: 'stroke' }).compare; }
    catch (e) { return new Intl.Collator('zh-Hant').compare; }   // 老瀏覽器退回預設中文排序
  })();
  function smartSort(a, b) {
    a = String(a); b = String(b);
    const rank = s => /^\d/.test(s) ? 0 : /^[A-Za-z]/.test(s) ? 2 : 1;  // 0數字 1中文 2英文
    const ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    if (ra === 0) {                                  // 數字：依數值大小
      const na = parseFloat(a), nb = parseFloat(b);
      if (na !== nb) return na - nb;
    }
    return strokeCmp(a, b);                          // 中文筆畫；英文 A-Z 也由 collator 處理
  }

  /* ── 系列/主標/副標選項 ── */
  function getSeries() {
    return uniq(ALL.map(p => p.系列).filter(Boolean)).sort(smartSort);
  }
  function getMains(series) {
    return uniq(
      ALL.filter(p => !series || p.系列 === series).map(p => p.主標).filter(Boolean)
    ).sort(smartSort);
  }
  function getSubs(series, main) {
    return uniq(
      ALL
        .filter(p => (!series || p.系列 === series) && (!main || p.主標 === main))
        .map(p => p.副標).filter(Boolean)
    ).sort(smartSort);
  }

  /* ── 標籤池（v0.4 M2：綁系列） ──
     選了具體系列 → 只彙總該系列 SKU 的標籤；「全部系列」→ 列全部。
     解決原本抓全資料庫 200+ 種與系列無關標籤的問題。 */
  function getTags(series) {
    const pool = new Set();
    ALL
      .filter(p => !series || p.系列 === series)
      .forEach(p => (p.標籤 || []).forEach(t => pool.add(t)));
    return [...pool].sort(smartSort);
  }

  /* ── 粉色 attribute schema（§6.3） ── */
  function buildAttrSchemas(series) {
    if (!series) return [];
    const list = ALL.filter(p => p.系列 === series);
    const keys = new Set();
    list.forEach(p => Object.keys(p.attributes || {}).forEach(k => keys.add(k)));

    const schemas = [];
    keys.forEach(key => {
      const raw = list.map(p => p.attributes?.[key]).filter(v => v != null && v !== '');
      const distinctStr = uniq(raw.map(v => String(v)));
      if (distinctStr.length < 2) return;   // §6.3 動態顯示規則

      if (raw.every(isNumeric)) {
        schemas.push({
          key, type: 'numeric_range',
          min: Math.min(...raw),
          max: Math.max(...raw)
        });
      } else if (raw.some(v => typeof v === 'string' && v.includes(','))) {
        const tags = new Set();
        raw.forEach(v => String(v).split(',').forEach(t => {
          const x = t.trim();
          if (x) tags.add(x);
        }));
        schemas.push({ key, type: 'multi_value_tag', options: [...tags].sort(smartSort) });
      } else {
        schemas.push({ key, type: 'discrete_text', options: distinctStr.sort(smartSort) });
      }
    });
    // 數值範圍排在前
    schemas.sort((a, b) => (a.type === b.type ? 0 : a.type === 'numeric_range' ? -1 : 1));
    return schemas;
  }

  /* ── 過濾：一般搜索 (§3.2 + §3.3) ── */
  function matchGeneral(p) {
    const q = state.q.trim().toLowerCase();
    if (!q) return true;

    // §3.3 數值範圍命中
    const qNum = Number(q);
    if (Number.isFinite(qNum) && q !== '') {
      // 零售價精確
      if (p.零售價 === qNum) return true;
      // attributes 數值或範圍字串
      for (const v of Object.values(p.attributes || {})) {
        if (isNumeric(v) && v === qNum) return true;
        if (typeof v === 'string') {
          const r = parseRange(v);
          if (r && qNum >= r[0] && qNum <= r[1]) return true;
        }
      }
    }

    const hay = [
      p.主型號, p.品項名稱, p.型號, p.簡述, p.副標,
      ...(p.標籤 || [])
    ].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  }

  /* ── 過濾：進階搜索 (§4 + §5) ── */
  function matchAdvanced(p) {
    if (state.series && p.系列 !== state.series) return false;
    if (state.main   && p.主標 !== state.main)   return false;
    if (state.sub    && p.副標 !== state.sub)    return false;

    if (state.tags.size) {
      const pTags = new Set(p.標籤 || []);
      for (const sel of state.tags) {
        if (!pTags.has(sel)) return false;   // AND within
      }
    }

    const price = p.零售價;
    if (state.priceMin !== '') {
      if (price == null || price < Number(state.priceMin)) return false;
    }
    if (state.priceMax !== '') {
      if (price == null || price > Number(state.priceMax)) return false;
    }

    for (const [k, f] of Object.entries(state.attrs)) {
      const v = p.attributes?.[k];
      if (f instanceof Set) {
        if (f.size === 0) continue;
        if (v == null) return false;   // §5.3 空值排除
        const items = typeof v === 'string' && v.includes(',')
          ? v.split(',').map(s => s.trim())
          : [String(v)];
        for (const sel of f) {
          if (!items.includes(sel)) return false;   // AND within
        }
      } else if (f && typeof f === 'object') {
        const n = isNumeric(v) ? v : Number(v);
        if (!Number.isFinite(n)) return false;
        if (f.min !== '' && n < Number(f.min)) return false;
        if (f.max !== '' && n > Number(f.max)) return false;
      }
    }
    return true;
  }

  function runFilter() {
    filtered = ALL.filter(p => matchGeneral(p) && matchAdvanced(p));
    $('result-count').textContent = `共 ${filtered.length} 項產品`;
    state.page = 1;   // v0.4 M7：任一篩選變更回到第 1 頁
    renderGrid();
  }

  /* ── 渲染：選單與 chips ── */
  function populateSelect(sel, options, placeholder) {
    sel.innerHTML = `<option value="">${esc(placeholder)}</option>` +
      options.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  }

  /* ── 多選下拉元件（單一檔位內 AND） ── */
  function closeAllDropdowns() {
    document.querySelectorAll('.md-panel').forEach(p => p.hidden = true);
    document.querySelectorAll('.md-toggle.open').forEach(t => {
      t.classList.remove('open');
      t.setAttribute('aria-expanded', 'false');
    });
  }

  function createMultiDropdown({ options, placeholder, onChange }) {
    const div = document.createElement('div');
    div.className = 'multi-dropdown';
    div.innerHTML = `
      <button class="md-toggle" type="button" aria-expanded="false">
        <span class="md-summary">${esc(placeholder || '全部')}</span>
        <span class="md-arrow">▾</span>
      </button>
      <div class="md-panel" hidden>
        <div class="md-hint">勾選多項 = 全部都要符合（AND）</div>
        ${options.map(o => `
          <label class="md-option">
            <input type="checkbox" value="${esc(o)}">
            <span>${esc(o)}</span>
          </label>
        `).join('')}
      </div>
    `;
    const toggle  = div.querySelector('.md-toggle');
    const panel   = div.querySelector('.md-panel');
    const summary = div.querySelector('.md-summary');

    toggle.addEventListener('click', e => {
      e.stopPropagation();
      const opening = panel.hidden;
      closeAllDropdowns();
      if (opening) {
        panel.hidden = false;
        toggle.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
      }
    });

    div.addEventListener('click', e => e.stopPropagation());

    div.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const selected = [...div.querySelectorAll('input:checked')].map(c => c.value);
        if (selected.length === 0) {
          summary.textContent = placeholder || '全部';
          summary.classList.remove('has-selection');
        } else {
          summary.textContent = selected.length === 1
            ? selected[0]
            : `已選 ${selected.length} 項`;
          summary.classList.add('has-selection');
        }
        onChange(selected);
      });
    });

    return div;
  }

  /* 共用：把標籤多選下拉建到指定容器（AND 語意） */
  function buildTagDropdownInto(box, tags) {
    box.innerHTML = '';
    if (tags.length === 0) {
      box.innerHTML = '<span class="chip-empty">（無標籤資料）</span>';
      return;
    }
    const dd = createMultiDropdown({
      options: tags,
      placeholder: '全部標籤',
      onChange: (selected) => {
        state.tags = new Set(selected);
        runFilter();
      }
    });
    box.appendChild(dd);
  }

  /* 共通區標籤（第一段）：僅「全部系列」時顯示全部標籤。
     選了具體系列 → 隱藏此處，改在「系列獨有屬性」區顯示該系列標籤（見 renderPinkFilters）。v0.5 回饋1 */
  function renderTagDropdown() {
    const field = $('tags-field-common');
    if (state.series) {
      field.hidden = true;
      $('filter-tags').innerHTML = '';
      return;
    }
    field.hidden = false;
    buildTagDropdownInto($('filter-tags'), getTags(''));
  }

  function renderPinkFilters() {
    const wrap  = $('pink-section');
    const inner = $('pink-filters');
    state.attrs = {};
    inner.innerHTML = '';
    if (!state.series) { wrap.hidden = true; return; }

    const seriesTags = getTags(state.series);
    const schemas = buildAttrSchemas(state.series);
    if (seriesTags.length === 0 && schemas.length === 0) { wrap.hidden = true; return; }
    wrap.hidden = false;

    // v0.5 回饋1：系列標籤下拉置於「系列獨有屬性」最上方
    if (seriesTags.length) {
      const tagField = document.createElement('div');
      tagField.className = 'filter-field span-full';
      const tagLabel = document.createElement('label');
      tagLabel.textContent = '標籤（可複選）';
      tagField.appendChild(tagLabel);
      const tagBox = document.createElement('div');
      tagBox.className = 'chip-group';
      tagField.appendChild(tagBox);
      inner.appendChild(tagField);
      buildTagDropdownInto(tagBox, seriesTags);
    }

    if (schemas.length === 0) return;

    const row = document.createElement('div');
    row.className = 'filter-row';

    schemas.forEach(s => {
      const field = document.createElement('div');
      field.className = 'filter-field';

      if (s.type === 'numeric_range') {
        state.attrs[s.key] = { min: '', max: '' };
        field.innerHTML = `
          <label>${esc(s.key)} <span style="font-weight:400;color:#888">(${s.min}–${s.max})</span></label>
          <div class="range-pair">
            <input type="number" class="filter-input attr-range-min" data-key="${esc(s.key)}" placeholder="最低" inputmode="decimal">
            <span class="range-separator">～</span>
            <input type="number" class="filter-input attr-range-max" data-key="${esc(s.key)}" placeholder="最高" inputmode="decimal">
          </div>`;
      } else {
        state.attrs[s.key] = new Set();
        const label = document.createElement('label');
        label.innerHTML = esc(s.key) + (s.type === 'multi_value_tag'
          ? ' <span style="font-weight:400;color:#888">（多值）</span>'
          : '');
        field.appendChild(label);
        const dd = createMultiDropdown({
          options: s.options,
          placeholder: '全部',
          onChange: (selected) => {
            state.attrs[s.key] = new Set(selected);
            runFilter();
          }
        });
        field.appendChild(dd);
      }
      row.appendChild(field);
    });
    inner.appendChild(row);

    inner.querySelectorAll('.attr-range-min').forEach(el => {
      el.addEventListener('input', e => {
        state.attrs[e.target.dataset.key].min = e.target.value;
        runFilter();
      });
    });
    inner.querySelectorAll('.attr-range-max').forEach(el => {
      el.addEventListener('input', e => {
        state.attrs[e.target.dataset.key].max = e.target.value;
        runFilter();
      });
    });
  }

  /* ── 連動 ── */
  function refreshMainSubOptions() {
    populateSelect($('filter-main'), getMains(state.series), '全部');
    populateSelect($('filter-sub'),  getSubs(state.series, state.main), '全部');
    $('filter-main').value = state.main;
    $('filter-sub').value = state.sub;
  }

  function onSeriesChange(value) {
    state.series = value;
    state.main = '';
    state.sub = '';
    state.tags = new Set();      // v0.4 M2：切換系列重置標籤選取
    refreshMainSubOptions();
    renderTagDropdown();         // v0.4 M2：依新系列重建標籤選項
    renderPinkFilters();
    runFilter();
  }
  function onMainChange(value) {
    state.main = value;
    state.sub = '';
    populateSelect($('filter-sub'), getSubs(state.series, state.main), '全部');
    runFilter();
  }
  function onSubChange(value) {
    state.sub = value;
    runFilter();
  }

  /* ── 卡片渲染 ── */
  function placeholder(p) {
    return `<div class="img-placeholder">
      <span class="placeholder-sku">${esc(p.sku)}</span>
      <span class="placeholder-sub">${esc(p.副標 || '')}</span>
    </div>`;
  }

  function imgSrc(p) {
    if (!p.圖片資料夾) return null;
    return `產品圖庫/${p.圖片資料夾}/001.png`;
  }

  function renderImg(p) {
    const src = imgSrc(p);
    if (!src) return placeholder(p);
    return `<img src="${esc(src)}" alt="${esc(p.主標 || p.sku)}" loading="lazy"
      onerror="this.parentElement.innerHTML=window.getPlaceholder('${esc(p.sku)}')">`;
  }
  window.getPlaceholder = (sku) => {
    const p = ALL.find(x => x.sku === sku);
    return p ? placeholder(p) : '';
  };

  function stockClass(s) {
    if (!s) return '';
    if (s.startsWith('○')) return 'stock-ok';
    if (s.startsWith('△')) return 'stock-low';
    if (s.startsWith('X')) return 'stock-out';
    return '';
  }

  function fmtPrice(n) {
    return n == null ? '' : `NT$${Number(n).toLocaleString()}`;
  }

  function renderCard(p) {
    const tags = (p.標籤 || []).slice(0, 3).map(t =>
      `<span class="tag">${esc(t)}</span>`
    ).join('');
    const sc = stockClass(p.庫存狀態);
    return `<article class="card" tabindex="0" data-sku="${esc(p.sku)}" role="button"
        aria-label="${esc(`${p.主標 || ''} ${p.副標 || ''}`)}">
      <div class="card-img">${renderImg(p)}</div>
      <div class="card-body">
        <div class="card-name">${esc(p.主標 || '')}</div>
        <div class="card-subrow">
          ${p.副標 ? `<span class="card-sub">${esc(p.副標)}</span>` : ''}
          ${p.主型號 ? `<span class="card-model">${esc(p.主型號)}</span>` : ''}
        </div>
        ${p.簡述 ? `<div class="card-desc">${esc(p.簡述)}</div>` : ''}
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
        <div class="card-foot">
          ${p.庫存狀態 ? `<span class="stock-badge ${sc}">${esc(p.庫存狀態.trim())}</span>` : ''}
          ${p.零售價 != null ? `<div class="card-price">${esc(fmtPrice(p.零售價))}</div>` : ''}
        </div>
      </div>
    </article>`;
  }

  function renderGrid() {
    const grid = $('product-grid');
    const empty = $('no-result');
    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.hidden = false;
      renderPagination(0);
      return;
    }
    empty.hidden = true;
    // v0.4 M7：依目前頁碼切片
    const pages = Math.ceil(filtered.length / PAGE_SIZE);
    state.page = Math.min(Math.max(state.page, 1), pages);
    const start = (state.page - 1) * PAGE_SIZE;
    grid.innerHTML = filtered.slice(start, start + PAGE_SIZE).map(renderCard).join('');
    renderPagination(filtered.length);
  }

  /* ── v0.4 M7：分頁列（固定底部、視窗式頁碼） ── */
  function renderPagination(total) {
    const bar = $('pagination');
    const pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) {
      bar.hidden = true;
      bar.innerHTML = '';
      document.body.classList.remove('has-pagination');
      return;
    }
    document.body.classList.add('has-pagination');
    const cur = state.page;
    const win = [];
    const add = n => { if (n >= 1 && n <= pages && !win.includes(n)) win.push(n); };
    add(1); add(2);
    for (let i = cur - 1; i <= cur + 1; i++) add(i);
    add(pages - 1); add(pages);
    win.sort((a, b) => a - b);

    let html = `<button class="page-btn" data-page="${cur - 1}" ${cur <= 1 ? 'disabled' : ''} aria-label="上一頁">‹</button>`;
    let prev = 0;
    win.forEach(n => {
      if (n - prev > 1) html += `<span class="page-ellipsis">…</span>`;
      html += `<button class="page-btn ${n === cur ? 'active' : ''}" data-page="${n}"${n === cur ? ' aria-current="page"' : ''}>${n}</button>`;
      prev = n;
    });
    html += `<button class="page-btn" data-page="${cur + 1}" ${cur >= pages ? 'disabled' : ''} aria-label="下一頁">›</button>`;
    bar.innerHTML = html;
    bar.hidden = false;
  }

  function goToPage(p) {
    const pages = Math.ceil(filtered.length / PAGE_SIZE);
    if (p < 1 || p > pages || p === state.page) return;
    state.page = p;
    renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ── Modal ── */
  function openModal(sku) {
    const p = ALL.find(x => x.sku === sku);
    if (!p) return;
    currentModalSku = sku;
    savedScrollY = window.scrollY;

    const src = imgSrc(p);
    const galleryHTML = src ? `
      <div class="modal-gallery">
        <img id="modal-main-img" class="modal-main-img"
             style="cursor:zoom-in" src="${esc(src)}"
             alt="${esc(p.主標 || p.sku)}"
             onerror="this.outerHTML=window.getPlaceholder('${esc(p.sku)}')">
        <button class="gallery-nav gallery-nav-prev" id="gallery-nav-prev" type="button" aria-label="上一個">‹</button>
        <button class="gallery-nav gallery-nav-next" id="gallery-nav-next" type="button" aria-label="下一個">›</button>
      </div>` : '';

    function row(label, value) {
      if (value == null || value === '') return '';
      return `<tr><th>${esc(label)}</th><td>${esc(value)}</td></tr>`;
    }
    // v0.4 M5：標籤沿用卡片單色 tag chip 形式
    function rowTags(label, list) {
      if (!list || list.length === 0) return '';
      const chips = list.map(t => `<span class="tag">${esc(t)}</span>`).join('');
      return `<tr><th>${esc(label)}</th><td><div class="spec-tags">${chips}</div></td></tr>`;
    }

    // v0.4 M5：attributes 順序沿用 JSON（= Excel 欄序，配套轉檔腳本保證）
    const attrRows = Object.entries(p.attributes || {})
      .map(([k, v]) => row(k, v))
      .join('');

    // 多層定價：§F-05 預設隱藏；每個按鈕獨立揭示；關閉 Modal 後自動重置
    const priceHTML = p.零售價 != null ? `
      <div class="price-reveal-area">
        <div class="price-grid">
          ${PRICE_TIERS.map((t, i) => {
            const amount = Math.round(p.零售價 * t.mult);
            return `<div class="price-tier">
              <button class="price-reveal-btn" data-tier="${i}">🔒 ${esc(t.label)}</button>
              <div class="price-revealed-wrap" data-tier="${i}" hidden>
                <span class="price-revealed" style="color:${t.color}">${esc(fmtPrice(amount))}</span>
                <span class="price-tier-label">${esc(t.label)}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="price-hint">⚠️ 示意用假價（依零售價推算），等實裝後端後依帳號層級顯示</div>
      </div>` : '';

    const notesHTML = p.備註 ? `<div class="modal-notes">備註：${esc(p.備註)}</div>` : '';

    const stockCls = stockClass(p.庫存狀態);
    $('modal-content').innerHTML = `
      <div class="modal-header">
        <div id="modal-title" class="modal-name">${esc(p.主標 || '')}</div>
        ${(p.副標 || p.簡述) ? `<div class="modal-subline">
          ${p.副標 ? `<span class="modal-sub">${esc(p.副標)}</span>` : ''}
          ${p.簡述 ? `<span class="modal-desc">${esc(p.簡述)}</span>` : ''}
        </div>` : ''}
        ${p.庫存狀態 ? `<span class="stock-badge ${stockCls}">${esc(p.庫存狀態.trim())}</span>` : ''}
      </div>
      ${galleryHTML}
      <div class="modal-specs">
        <table class="specs-table">
          ${row('品項名稱', p.品項名稱)}
          ${row('型號', p.型號)}
          ${row('頁數', p.型錄頁數)}
          ${attrRows}
          ${rowTags('標籤', p.標籤)}
        </table>
      </div>
      ${priceHTML}
      ${notesHTML}`;

    // Lightbox 觸發
    const mainImg = $('modal-main-img');
    if (mainImg && src) {
      mainImg.addEventListener('click', () => openLightbox(src));
    }

    // 圖片上的左右切換箭頭（手機端可見，桌面用外側箭頭）
    const gPrev = $('gallery-nav-prev');
    const gNext = $('gallery-nav-next');
    if (gPrev && gNext) {
      const idx = filtered.findIndex(x => x.sku === sku);
      gPrev.disabled = idx <= 0;
      gNext.disabled = idx >= filtered.length - 1;
      gPrev.addEventListener('click', () => navModal(-1));
      gNext.addEventListener('click', () => navModal(1));
    }

    // Price reveal — 每個 tier 獨立揭示
    $('modal-content').querySelectorAll('.price-reveal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = btn.dataset.tier;
        btn.style.display = 'none';
        const wrap = $('modal-content').querySelector(`.price-revealed-wrap[data-tier="${i}"]`);
        if (wrap) wrap.hidden = false;
      });
    });

    $('modal-overlay').hidden = false;
    document.body.style.overflow = 'hidden';
    $('modal-close').focus();
    updateModalNavBtns();
  }

  function closeModal() {
    $('modal-overlay').hidden = true;
    document.body.style.overflow = '';
    window.scrollTo(0, savedScrollY);
    currentModalSku = null;
  }

  function navModal(dir) {
    if (!currentModalSku) return;
    const idx = filtered.findIndex(p => p.sku === currentModalSku);
    const next = idx + dir;
    if (next < 0 || next >= filtered.length) return;
    openModal(filtered[next].sku);
  }

  function updateModalNavBtns() {
    if (!currentModalSku) return;
    const idx = filtered.findIndex(p => p.sku === currentModalSku);
    $('modal-nav-prev').disabled = idx <= 0;
    $('modal-nav-next').disabled = idx >= filtered.length - 1;
  }

  /* ── 手機端：Modal 觸控滑動切換產品 ──
     左滑 → 下一張、右滑 → 上一張。passive 監聽，不影響規格表垂直滾動。 */
  function setupSwipeNav() {
    const modal = $('modal');
    let startX = 0, startY = 0, startT = 0, active = false;

    modal.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { active = false; return; }
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; startT = Date.now();
      active = true;
    }, { passive: true });

    modal.addEventListener('touchend', e => {
      if (!active || e.changedTouches.length !== 1) return;
      active = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      const dt = Date.now() - startT;
      if (dt > 600) return;                              // 太慢 → 滾動或猶豫
      if (Math.abs(dx) < 50) return;                     // 位移不足 → tap
      if (Math.abs(dx) < Math.abs(dy) * 1.5) return;     // 不夠水平 → 垂直滾動
      navModal(dx < 0 ? 1 : -1);
    }, { passive: true });
  }

  /* ── Lightbox ── */
  function openLightbox(src) {
    $('lightbox-img').src = src;
    $('lightbox').hidden = false;
  }
  function closeLightbox() { $('lightbox').hidden = true; }

  /* ── 清除全部篩選 ── */
  function clearAll() {
    state.q = '';
    state.series = '';
    state.main = '';
    state.sub = '';
    state.tags = new Set();
    state.priceMin = '';
    state.priceMax = '';
    state.attrs = {};

    $('header-search-input').value = '';
    $('filter-series').value = '';
    $('filter-price-min').value = '';
    $('filter-price-max').value = '';

    refreshMainSubOptions();
    renderTagDropdown();
    renderPinkFilters();
    runFilter();
  }

  /* ── v0.5：搜索輸入（唯一來源 = header 搜索欄） ── */
  function setQuery(v) {
    state.q = v;
    if ($('header-search-input').value !== v) $('header-search-input').value = v;
    runFilter();
  }

  /* ── v0.4 M8：header 面板（搜索 / 選單）開合，互斥 ── */
  function closeHeaderPanels() {
    $('header-search').hidden = true;
    $('main-menu').hidden = true;
    $('header-search-btn').setAttribute('aria-expanded', 'false');
    $('menu-btn').setAttribute('aria-expanded', 'false');
  }
  function toggleHeaderSearch() {
    const willOpen = $('header-search').hidden;
    closeHeaderPanels();
    if (willOpen) {
      $('header-search').hidden = false;
      $('header-search-btn').setAttribute('aria-expanded', 'true');
      $('header-search-input').focus();
    }
  }
  function toggleMenu() {
    const willOpen = $('main-menu').hidden;
    closeHeaderPanels();
    if (willOpen) {
      $('main-menu').hidden = false;
      $('menu-btn').setAttribute('aria-expanded', 'true');
    }
  }

  /* ── 初始化 ── */
  function init() {
    populateSelect($('filter-series'), getSeries(), '全部系列');
    refreshMainSubOptions();
    renderTagDropdown();
    renderPinkFilters();

    // 事件 — v0.5：搜索唯一入口 = header 🔍 面板（一般 + 進階）
    $('header-search-input').addEventListener('input', e => setQuery(e.target.value));
    $('header-search-btn').addEventListener('click', e => { e.stopPropagation(); toggleHeaderSearch(); });
    $('header-search-close').addEventListener('click', closeHeaderPanels);
    $('header-search').addEventListener('click', e => e.stopPropagation());
    $('menu-btn').addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
    $('main-menu').addEventListener('click', e => e.stopPropagation());
    $('main-menu').querySelectorAll('.menu-item[data-soon]').forEach(btn => {
      btn.addEventListener('click', () => { closeHeaderPanels(); alert('此功能即將上線'); });
    });
    $('menu-update-time').textContent = '資料更新時間：原型抽樣資料（2026-05）';

    // v0.4 M7：分頁列點擊
    $('pagination').addEventListener('click', e => {
      const btn = e.target.closest('.page-btn');
      if (!btn || btn.disabled) return;
      goToPage(Number(btn.dataset.page));
    });

    $('advanced-toggle').addEventListener('click', e => {
      const expanded = e.currentTarget.getAttribute('aria-expanded') === 'true';
      e.currentTarget.setAttribute('aria-expanded', String(!expanded));
      $('advanced-panel').hidden = expanded;
    });

    $('filter-series').addEventListener('change', e => onSeriesChange(e.target.value));
    $('filter-main').addEventListener('change', e => onMainChange(e.target.value));
    $('filter-sub').addEventListener('change', e => onSubChange(e.target.value));
    $('filter-price-min').addEventListener('input', e => { state.priceMin = e.target.value; runFilter(); });
    $('filter-price-max').addEventListener('input', e => { state.priceMax = e.target.value; runFilter(); });

    $('clear-filters').addEventListener('click', clearAll);
    $('reset-btn').addEventListener('click', clearAll);

    // Modal
    $('product-grid').addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (card) openModal(card.dataset.sku);
    });
    $('product-grid').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const card = e.target.closest('.card');
        if (card) { e.preventDefault(); openModal(card.dataset.sku); }
      }
    });
    $('modal-close').addEventListener('click', closeModal);
    $('modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
    $('modal-nav-prev').addEventListener('click', () => navModal(-1));
    $('modal-nav-next').addEventListener('click', () => navModal(1));
    setupSwipeNav();

    // Lightbox
    $('lightbox-close').addEventListener('click', closeLightbox);
    $('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    // Multi-dropdown / header 面板：點擊外部 / ESC 自動關閉
    document.addEventListener('click', () => { closeAllDropdowns(); closeHeaderPanels(); });

    // Keyboard
    document.addEventListener('keydown', e => {
      const lbOpen = !$('lightbox').hidden;
      const modalOpen = !$('modal-overlay').hidden;
      if (e.key === 'Escape') {
        closeAllDropdowns();
        closeHeaderPanels();
        if (lbOpen) return closeLightbox();
        if (modalOpen) return closeModal();
      }
      if (lbOpen) return;
      if (modalOpen) {
        if (e.key === 'ArrowLeft')  { e.preventDefault(); navModal(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); navModal(1);  }
      }
    });

    runFilter();
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
